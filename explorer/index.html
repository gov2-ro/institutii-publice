  </div>
</footer>
<dialog id="detail" aria-labelledby="dlg-title"></dialog>
<dialog id="about" aria-labelledby="about-title"></dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const main = $('main'), results = $('results');

  /* ---------- helpers ---------- */
  const h = (tag, props, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  };
  const fold = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  // search form: no diacritics, lower case, every run of punctuation / hyphens / spaces is one space
  const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const fmt = n => n.toLocaleString('ro-RO');
  const coll = new Intl.Collator('ro');
  const isHttp = u => /^https?:\/\//i.test(u || '');
  const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;

  /* ---------- loading ---------- */
  async function fetchJson(url) {
    let res;
    try { res = await fetch(url); } catch (e) { throw { kind: 'net', url }; }
    if (!res.ok) throw { kind: 'http', status: res.status, url };
    try { return await res.json(); } catch (e) { throw { kind: 'json', url }; }
  }
  function showError(err) {
    console.error('Failed to load data:', err);
    const why = err && err.kind === 'http' ? `Serverul a răspuns cu eroarea ${err.status} pentru fișierul ${err.url}.`
      : err && err.kind === 'json' ? `Fișierul ${err.url} nu este un JSON valid sau este incomplet.`
      : err && err.kind === 'net' ? 'Nu s-a putut contacta serverul. Verifică conexiunea la internet.'
      : 'Datele nu au putut fi încărcate.';
    $('stats').textContent = 'Datele nu sunt disponibile';
    main.setAttribute('aria-busy', 'false');
    results.replaceChildren(h('div', { class: 'notice', role: 'alert' },
      h('p', null, 'Nu s-au putut încărca datele instituțiilor.'), h('p', { class: 'sub' }, why),
      h('p', { class: 'sub' }, 'Încearcă din nou. Dacă problema persistă, datele nu au fost publicate sau sunt temporar indisponibile.'),
      h('button', { class: 'g2-btn', type: 'button', onclick: load }, 'Reîncearcă')));
  }
  function load() {
    $('stats').textContent = 'Se încarcă datele…';
    main.setAttribute('aria-busy', 'true');
    results.replaceChildren(h('p', { class: 'notice', role: 'status' }, 'Se încarcă datele instituțiilor…'));
    Promise.all([fetchJson('metadata.json'), fetchJson('rows.json')]).then(([metadata, rows]) => {
      if (!metadata || !Array.isArray(metadata.categories) || !Array.isArray(metadata.counties) || !Array.isArray(rows)) throw { kind: 'json', url: 'metadata.json / rows.json' };
      start({ ...metadata, rows });
    }).catch(showError);
  }
  let started = false;

  function start(D) {
    if (started) return;
    /* ---------- data (everything below that can fail runs before any control is wired) ---------- */
    const { categories: cats, counties, families: fams = [] } = D;
    const rows = D.rows;
    rows.forEach((r, i) => {
      r.id = r.i || (r.f ? 'A' + r.f : 'X' + i);
      r.cat = cats[r.c];
      r.county = r.k == null ? '' : counties[r.k];
      r.fam = r.m == null ? '' : fams[r.m];
      r.hay = norm([r.n, r.f, r.id, r.u, r.county, r.w, r.e, ...(r.al || []), ...(r.mi || [])].filter(Boolean).join(' '));
    });
    rows.sort((a, b) => coll.compare(a.n, b.n));
    const byId = new Map(), byCif = new Map();
    for (const r of rows) { byId.set(r.id, r); if (r.f) byCif.set(r.f, r); }
    const mergedInto = new Map();                        // an id absorbed by a same-name merge -> the record that survived
    for (const r of rows) for (const m of r.mi || []) mergedInto.set(m, r);
    const famSize = new Map(), famCat = new Map();
    {
      const perCat = new Map();
      for (const r of rows) if (r.fam) {
        famSize.set(r.fam, (famSize.get(r.fam) || 0) + 1);
        if (!perCat.has(r.fam)) perCat.set(r.fam, new Map());
        const m = perCat.get(r.fam);
        m.set(r.cat, (m.get(r.cat) || 0) + 1);
      }
      for (const [f, m] of perCat) famCat.set(f, [...m].sort((a, b) => b[1] - a[1])[0][0]);
    }
    const subordinates = new Map();                 // parent cif -> rows
    for (const r of rows) for (const c of r.p || []) {
      if (!subordinates.has(c)) subordinates.set(c, []);
      subordinates.get(c).push(r);
    }

    /* ---------- state tree (metadata.state; spec: docs/specs/structura-statului.md) ---------- */
    const ST = D.state || { nodes: [], members: [], attach: [], uat: [], unclassified: [] };
    const STAT = 'stat';
    const vnode = new Map();                        // virtual node id -> { id, label, note, parent, recs, nodes }
    const place = new Map();                        // cif or virtual id -> id of its parent in the state tree
    const attachPar = new Map();                    // attached root cif -> parent cif (such a root has no `p` in the data)
    const noteOf = new Map();                       // cif -> note on its placement (3rd value of a state member)
    const addNode = (id, label, parent, note) => {
      const v = { id, label, note, parent, recs: [], nodes: [] };
      vnode.set(id, v);
      if (parent) vnode.get(parent).nodes.push(v);
      return v;
    };
    addNode(STAT, 'Statul', null);
    for (const n of ST.nodes) if (!n.parent) addNode(n.id, n.label, STAT, n.note);
    for (const n of ST.nodes) if (n.parent) addNode(n.id, n.label, n.parent, n.note);
    addNode('local', 'Administrația locală', STAT, 'Titlul III, cap. V secț. 2');
    addNode('neclasificate', 'Neclasificate', STAT, 'rădăcini ANAF fără loc în STATE_TREE');
    addNode('fara-anaf', 'Fără corespondent ANAF (ierarhie necunoscută)', STAT);
    const noCif = rows.filter(r => !r.f);
    for (const [c, node, note] of ST.members) {
      const r = byCif.get(c); if (!r) continue;
      vnode.get(node).recs.push(r); place.set(c, node);
      if (note) noteOf.set(c, note);
    }
    for (const [c, par] of ST.attach) {
      const r = byCif.get(c); if (!r) continue;
      attachPar.set(c, par); place.set(c, par);
      if (!subordinates.has(par)) subordinates.set(par, []);
      subordinates.get(par).push(r);
    }
    for (const c of ST.unclassified) { const r = byCif.get(c); if (r) { vnode.get('neclasificate').recs.push(r); place.set(c, 'neclasificate'); } }
    for (const c of ST.uat) {
      const r = byCif.get(c); if (!r) continue;
      const id = 'judet:' + (r.county || '(județ necunoscut)');
      (vnode.get(id) || addNode(id, r.county || '(județ necunoscut)', 'local')).recs.push(r);
      place.set(c, id);
    }
    vnode.get('local').nodes.sort((a, b) => (a.label === 'Bucuresti') - (b.label === 'Bucuresti') || coll.compare(a.label, b.label));
    for (const r of rows) if (r.f && r.p && !place.has(r.f)) place.set(r.f, r.p[0]);   // a child sits under its first ordonator
    const up = id => {
      const parent = vnode.has(id) ? vnode.get(id).parent : place.get(id);
      return parent === 'ministere' ? 'guvern' : parent;
    };
    const chain = id => { const out = []; for (let x = id, n = 0; x && n < 20; x = up(x), n++) out.unshift(x); return out; };   // [STAT, ..., id]
    const labelOf = id => vnode.has(id) ? vnode.get(id).label : byCif.get(id).n;
    const nodeKnown = id => vnode.has(id) || byCif.has(id);

    /* every record strictly below a record, through all levels (also below attached roots); each record once */
    const EMPTY = new Set(), descMemo = new Map();
    function desc(cif) {
      if (!subordinates.has(cif)) return EMPTY;
      if (descMemo.has(cif)) return descMemo.get(cif);
      const out = new Set(), seen = new Set([cif]), stack = [cif];
      while (stack.length) {
        const c = stack.pop();
        for (const k of subordinates.get(c) || []) {
          out.add(k);
          if (k.f && !seen.has(k.f)) { seen.add(k.f); stack.push(k.f); }
        }
      }
      const self = byCif.get(cif); if (self) out.delete(self);
      descMemo.set(cif, out);
      return out;
    }
    /* every record under a node, unfiltered (a record with two parents counts once) */
    const subMemo = new Map();
    function subtree(id) {
      if (subMemo.has(id)) return subMemo.get(id);
      const set = new Set();
      if (vnode.has(id)) {
        if (id === 'fara-anaf') noCif.forEach(r => set.add(r));
        const v = vnode.get(id);
        for (const r of v.recs) { set.add(r); desc(r.f).forEach(k => set.add(k)); }
        for (const n of v.nodes) subtree(n.id).forEach(r => set.add(r));
      } else { const r = byCif.get(id); set.add(r); desc(id).forEach(k => set.add(k)); }
      subMemo.set(id, set);
      return set;
    }

    const SOURCES = [['anaf', 'ANAF'], ['roepas', 'ROePAS'], ['reg', 'Registru'], ['decl', 'Declarații ANI'], ['nocif', 'Fără corespondent ANAF']];
    const srcTest = {
      anaf: r => r.s & 1, roepas: r => r.s & 2, reg: r => r.s & 4, decl: r => r.s & 8, nocif: r => !r.f,
    };
    const needsReview = r => !!(r.d || (r.mc && r.mc.length));

    const wires = [];                               // listeners are attached only after the first render succeeded
    const on = (t, ev, fn) => wires.push(() => t.addEventListener(ev, fn));

    /* ---------- filter state ---------- */
    const NO_FAMILY = '(fără tip comun)';
    const S = { q: '', cat: '', fam: '', county: '', uat: '', srcs: new Set(), srcMode: 'all', web: true, review: false,
      view: 'list', sort: 'n', node: '', id: '' };
    let qTokens = [], srcList = [];
    const pass = (r, skip) =>
      (skip === 'cat' || !S.cat || r.cat === S.cat) &&
      (skip === 'fam' || !S.fam || (r.fam || NO_FAMILY) === S.fam) &&
      (skip === 'county' || !S.county || r.county === S.county) &&
      (skip === 'uat' || !S.uat || r.u === S.uat) &&
      (skip === 'src' || !srcList.length || (S.srcMode === 'all' ? srcList.every(k => srcTest[k](r)) : srcList.some(k => srcTest[k](r)))) &&
      (!S.web || r.w) &&
      (!S.review || needsReview(r)) &&
      qTokens.every(t => r.hay.includes(t));

    const el = { q: $('q'), cat: $('cat'), fam: $('fam'), county: $('county'), uat: $('uat'), web: $('web'),
      noanaf: $('noanaf'), review: $('review'), sort: $('sort') };

    function fillSelect(sel, allLabel, entries, current) {   // entries: [[value, label, count]]
      sel.replaceChildren(h('option', { value: '' }, allLabel),
        ...entries.map(([v, label, n]) => h('option', { value: v }, `${label} (${fmt(n)})`)));
      sel.value = current;
    }
    const tally = (skip, key) => {
      const m = new Map();
      for (const r of rows) if (pass(r, skip)) m.set(key(r), (m.get(key(r)) || 0) + 1);
      return m;
    };
    function refreshFacets() {
      const c = tally('cat', r => r.cat);
      fillSelect(el.cat, 'Toate categoriile', cats.filter(x => c.has(x) || x === S.cat).map(x => [x, x, c.get(x) || 0]), S.cat);
      const f = tally('fam', r => r.fam || NO_FAMILY);
      fillSelect(el.fam, 'Toate tipurile', [...fams, NO_FAMILY].filter(x => f.has(x) || x === S.fam).map(x => [x, x, f.get(x) || 0]), S.fam);
      const k = tally('county', r => r.county);
      fillSelect(el.county, 'Toate județele', counties.filter(x => k.has(x) || x === S.county).map(x => [x, x, k.get(x) || 0]), S.county);
      refreshSrc();
      el.uat.disabled = !S.county;
      if (S.county) {
        const u = new Map();
        for (const r of rows) if (r.county === S.county && r.u && pass(r, 'uat')) u.set(r.u, (u.get(r.u) || 0) + 1);
        const list = [...u].sort((a, b) => coll.compare(a[0], b[0])).map(([x, n]) => [x, x, n]);
        fillSelect(el.uat, 'Toate localitățile', list, S.uat);
      } else {
        fillSelect(el.uat, 'Localitate (alege județ)', [], '');
      }
    }

    /* ---------- rendering ---------- */
    const srcBadges = r => [
      (r.s & 1) > 0 && h('span', { class: 'src a', title: 'Lista entităților publice ANAF' }, 'ANAF'),
      (r.s & 2) > 0 && h('span', { class: 'src r', title: 'Portalul ROePAS' }, 'ROePAS'),
      (r.s & 4) > 0 && h('span', { class: 'src g', title: 'Registrul Național al Instituțiilor Publice' }, 'Registru'),
      (r.s & 8) > 0 && h('span', { class: 'src d', title: `Declarații de avere și interese (ANI): ${fmt(r.dc || 0)} declarații` }, 'ANI'),
    ];
    const where = r => [r.u, r.county].filter(Boolean).join(', ');
    const domain = u => u.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    const siteLink = r => !r.w ? '' : isHttp(r.w)
      ? h('a', { href: r.w, target: '_blank', rel: 'noopener noreferrer', title: r.w, onclick: e => e.stopPropagation() }, domain(r.w))
      : domain(r.w);
    const emptyMsg = () => h('div', { class: 'empty' }, h('p', null, 'Nicio instituție nu corespunde filtrelor.'),
      h('button', { class: 'g2-btn g2-secondary', type: 'button', onclick: () => { clearFilters(); update(); } }, 'Resetează filtrele'));
    const rowKey = (r, open) => e => { if (e.key === 'Enter') open(r); };

    /* append `items` in pages of `size`; the "more" button lives in btnHost (default: the container itself) */
    function chunked(container, items, make, size = 100, small = false, btnHost = container) {
      let shown = 0;
      const btn = h('button', { class: 'g2-btn g2-secondary more' + (small ? ' small' : ''), type: 'button' });
      const more = () => {
        const next = items.slice(shown, shown + size);
        const frag = document.createDocumentFragment();
        for (const it of next) frag.append(make(it));
        container.insertBefore(frag, btn.parentNode === container ? btn : null);
        shown += next.length;
        if (shown >= items.length) btn.remove();
        else btn.textContent = `Arată încă ${fmt(Math.min(size, items.length - shown))} (din ${fmt(items.length - shown)} rămase)`;
      };
      btn.addEventListener('click', more);
      btnHost.append(btn);
      more();
    }

    function renderList(items) {
      if (!items.length) return emptyMsg();
      const body = h('tbody');
      const table = h('table', { class: 'g2-table main', 'aria-label': 'Instituții' },
        h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'Instituție'), h('th', { class: 'c', scope: 'col' }, 'Contact'))), body);
      const wrap = h('div');
      const kind = r => [r.cat, r.fam].filter(Boolean).join(' · ');
      const row = r => h('tr', { tabindex: 0, 'data-id': r.id, onclick: () => openRecord(r), onkeydown: rowKey(r, openRecord) },
        h('td', null, h('span', { class: 'nm' }, r.n),
          r.mc && r.mc.length ? h('span', { class: 'g2-tag', 'data-tone': 'warning' }, 'potrivire neclară') : null,
          r.d ? h('span', { class: 'g2-tag', 'data-tone': 'warning' }, 'posibil duplicat') : null,
          h('div', { class: 'sub' }, kind(r), where(r) ? h('span', { class: 'where' }, (kind(r) ? ' · ' : '') + where(r)) : null,
            S.sort === 'dc' && r.dc ? h('span', { class: 'dc' }, ' · ' + plural(r.dc, 'declarație', 'declarații')) : null)),
        h('td', { class: 'c contact' }, [r.w && h('div', { class: 'line site' }, siteLink(r)),
          (r.e || r.ph) && h('div', { class: 'line', title: [r.e, r.ph].filter(Boolean).join(' · ') }, [r.e, r.ph].filter(Boolean).join(' · '))]));
      wrap.append(table);
      chunked(body, items, row, 100, false, wrap);
      return wrap;
    }

    /* tree nodes are <details> that fill their children on first open */
    const action = (text, title, fn) => h('button', { class: 'link count', type: 'button', title,
      onclick: e => { e.preventDefault(); e.stopPropagation(); fn(); } }, text);
    function branch({ label, meta, note, ctx, cls, info, focus, kids, open, attrs }) {
      const d = h('details', { class: [cls, ctx ? 'ctx' : ''].filter(Boolean).join(' '), ...(attrs || {}) },
        h('summary', null, h('span', { class: 'label', title: note }, label), meta ? h('span', { class: 'count' }, meta) : null,
          note ? h('span', { class: 'count note' }, '· ' + note) : null,
          info ? action('detalii', 'Detalii', info) : null,
          focus ? action('focalizează', 'Arată doar acest nod', focus) : null));
      const box = h('div', { class: 'kids' });
      d.append(box);
      let filled = false;
      const fill = () => { if (!filled) { filled = true; kids(box); } };
      d.addEventListener('toggle', () => { if (d.open) fill(); });
      if (open) { d.open = true; fill(); }
      return d;
    }
    /* institutions inside a tree node are shown as a table: name, category, location, site */
    const COLS = {
      n: ['Instituție', r => [h('span', { class: 'nm' }, r.n), noteOf.has(r.f) ? h('div', { class: 'sub' }, 'Notă: ' + noteOf.get(r.f)) : null]],
      cat: ['Categorie', r => r.cat],
      where: ['Locație', r => where(r)],
      site: ['Site', r => siteLink(r)],
    };
    const AUTH_COLS = ['n', 'cat', 'where', 'site'];

    function leafTable(list, matchSet, cols) {
      const body = h('tbody');
      const wrap = h('div', { class: 'lt-wrap' }, h('table', { class: 'g2-table lt', 'aria-label': 'Instituții' },
        h('thead', null, h('tr', null, cols.map(c => h('th', { class: 'c-' + c, scope: 'col' }, COLS[c][0])))), body));
      const row = r => h('tr', { class: matchSet.has(r) ? '' : 'ctx', tabindex: 0, 'data-id': r.id, onclick: () => openRecord(r),
          onkeydown: rowKey(r, openRecord) },
        cols.map(c => h('td', { class: 'c-' + c }, COLS[c][1](r))));
      chunked(body, list, row, 100, true, wrap);
      return wrap;
    }

    /* families with 3+ members become collapsible sub-groups; only in lists long enough to need it */
    const BUNDLE_MIN = 12;
    function bundleItems(list) {
      const byFam = new Map(), singles = [], bundles = [];
      for (const r of list) {
        if (!r.fam) { singles.push(r); continue; }
        if (!byFam.has(r.fam)) byFam.set(r.fam, []);
        byFam.get(r.fam).push(r);
      }
      for (const [fam, members] of byFam) {
        if (members.length >= 3) bundles.push({ fam, list: members });
        else singles.push(...members);
      }
      bundles.sort((a, b) => b.list.length - a.list.length);
      singles.sort((a, b) => coll.compare(a.n, b.n));
      return [...bundles, ...singles];
    }

    /* the contents of one authority node (or a root/unlinked group): type bundles first, then authorities
       that have subordinates of their own (expandable), then every remaining institution in one table */
    const SPLIT_MIN = 60;                            // a family group bigger than this splits by county
    function splitByCounty(box, list, ctx) {
      const m = new Map();
      for (const r of list) { const k = r.county || '(județ necunoscut)'; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
      chunked(box, [...m].sort((a, b) => coll.compare(a[0], b[0])), ([k, l]) => branch({
        label: k, meta: plural(l.length, 'instituție', 'instituții'), open: ctx.openAll,
        kids: bx => renderRecords(bx, l, ctx, false) }), 100, true);
    }
    function renderRecords(box, list, ctx, bundle = true) {
      const hasKids = r => !!(r.f && (ctx.kids.get(r.f) || ctx.filtered && subordinates.has(r.f)));
      const items = bundle && list.length > BUNDLE_MIN ? bundleItems(list) : list;
      const rest = items.filter(it => !it.list);
      chunked(box, items.filter(it => it.list), b => branch({
        label: b.fam, meta: plural(b.list.length, 'instituție', 'instituții'), open: ctx.openAll,
        kids: bx => b.list.length > SPLIT_MIN ? splitByCounty(bx, b.list, ctx) : renderRecords(bx, b.list, ctx, false) }), 100, true);
      chunked(box, rest.filter(hasKids), r => recordNode(r, ctx), 100, true);
      const flat = rest.filter(r => !hasKids(r));
      if (flat.length) box.append(leafTable(flat, ctx.matchSet, ctx.cols));
    }

    /* a record that has subordinates: counts are its unique descendants, the record itself excluded */
    function recordNode(r, ctx, open) {
      const ks = ctx.kids.get(r.f) || [], below = desc(r.f);
      let m = 0;
      if (ctx.filtered) for (const x of below) if (ctx.matchSet.has(x)) m++;
      const total = plural(below.size, 'subordonat', 'subordonate');
      return branch({ label: ctx.relabel.get(r.f) || r.n, note: noteOf.get(r.f),
        meta: ctx.filtered ? `${fmt(m)} / ${total}` : total, attrs: { 'data-cif': r.f },
        ctx: !ctx.matchSet.has(r), open: open || ctx.openAll, info: () => openRecord(r), focus: open ? null : () => focusNode(r.f),
        kids: box => {
          if (ks.length) renderRecords(box, ks, ctx); else box.append(leafTable([r], ctx.matchSet, ctx.cols));
          revealHidden(box, subordinates.get(r.f) || [], ctx);
        } });
    }
    /* a filter hides the non-matching subordinates of a node; this row shows them on request, dimmed, so the
       structure stays complete. Their own subordinates open the same way. */
    function revealHidden(box, list, ctx) {
      if (!ctx.filtered) return;
      const hidden = [...new Set(list)].filter(r => !ctx.matchSet.has(r) && !(r.f && ctx.kids.has(r.f)));
      if (!hidden.length) return;
      const onlyWeb = S.web && !(S.q || S.cat || S.fam || S.county || S.uat || S.srcs.size || S.review);
      const text = onlyWeb ? plural(hidden.length, 'subordonată fără site', 'subordonate fără site')
        : plural(hidden.length, 'subordonată care nu corespunde filtrelor', 'subordonate care nu corespund filtrelor');
      const btn = h('button', { class: 'link acc reveal', type: 'button', 'aria-expanded': 'false', onclick: () => {
        const bx = h('div', { class: 'revealed' });
        renderRecords(bx, hidden.sort((a, b) => coll.compare(a.n, b.n)), ctx);
        btn.replaceWith(bx);
      } }, '+ arată și ' + text);
      box.append(btn);
    }

    /* ---------- "Structura statului" ---------- */
    const isFiltered = () => !!(S.q || S.cat || S.fam || S.county || S.uat || S.srcs.size || S.web || S.review);
    const KINDS = [['Municipii', /^municipi/], ['Sectoare', /^sectorul/], ['Orașe', /^oras/], ['Comune', /^comuna/], ['Altele', /./]];
    const isCountyRec = r => /^judetul\b/.test(fold(r.n));

    /* the contents of a virtual node */
    function renderVNode(id, box, ctx) {
      const v = vnode.get(id);
      const recs = (id === 'fara-anaf' ? ctx.noCif : v.recs).filter(r => ctx.matchSet.has(r) || ctx.kids.has(r.f));
      if (id === 'guvern') {
        // Flatten the ministry heading in this view. Keep the curated membership and counts intact.
        const ministries = (vnode.get('ministere')?.recs || []).filter(r => ctx.matchSet.has(r) || ctx.kids.has(r.f));
        for (const r of [...recs, ...ministries.slice().sort((a, b) => coll.compare(a.n, b.n))]) box.append(recordNode(r, ctx));
        for (const n of v.nodes) if (n.id !== 'ministere' && ctx.visible(n.id)) box.append(vBranch(n.id, ctx));
        revealHidden(box, [...v.recs, ...(vnode.get('ministere')?.recs || [])], ctx);
        return;
      }
      if (id.startsWith('judet:')) {
        const county = recs.filter(isCountyRec), rest = recs.filter(r => !isCountyRec(r));
        for (const r of county) ctx.relabel.set(r.f, 'Consiliul Județean ' + v.label);
        if (county.length) renderRecords(box, county, ctx, false);
        const groups = KINDS.map(([label]) => [label, []]);
        for (const r of rest) groups[KINDS.findIndex(([, re]) => re.test(fold(r.n)))][1].push(r);
        const used = groups.filter(([, l]) => l.length);
        for (const [, l] of used) l.sort((a, b) => coll.compare(a.n, b.n));
        if (used.length === 1) renderRecords(box, used[0][1], ctx, false);
        else for (const [label, l] of used) box.append(branch({ label, meta: plural(l.length, 'autoritate', 'autorități'),
          open: ctx.openAll, kids: bx => renderRecords(bx, l, ctx, false) }));
        revealHidden(box, v.recs, ctx);
        return;
      }
      if (recs.length) renderRecords(box, recs, ctx, id === 'fara-anaf');
      for (const n of v.nodes) if (ctx.visible(n.id)) box.append(vBranch(n.id, ctx));
      if (id !== 'fara-anaf') revealHidden(box, v.recs, ctx);
    }
    /* a virtual group counts every unique record below it, descendants included; it is a group, not an institution */
    function vBranch(id, ctx, focused) {
      const v = vnode.get(id), total = subtree(id).size;
      return branch({ cls: 'grp', label: v.label, note: v.note, attrs: { 'data-vid': id },
        meta: ctx.filtered ? `${fmt(ctx.matchN(id))} / ${fmt(total)}` : plural(total, 'înregistrare', 'înregistrări'),
        open: focused || ctx.openAll, focus: focused ? null : () => focusNode(id), kids: box => renderVNode(id, box, ctx) });
    }

    function stateTarget(id) {
      const v = vnode.get(id);
      return v && !v.nodes.length && v.recs.length === 1 ? v.recs[0].f : id;
    }
    function focusNode(id) {
      const matches = [...subtree(id)].filter(r => pass(r));
      if (id !== STAT && matches.length === 1) { openRecord(matches[0]); return; }
      S.node = id === STAT ? '' : stateTarget(id);
      setView('stat'); window.scrollTo(0, 0);
    }
    /* the hash of the current state with some fields changed, and optionally a record open */
    function hrefFor(patch, id) {
      const saved = {};
      for (const k in patch) { saved[k] = S[k]; S[k] = patch[k]; }
      const p = browseParams();
      Object.assign(S, saved);
      if (id) p.set('id', id);
      return '#' + (p.toString() || 'v=list');
    }
    /* DS breadcrumbs. A step is [text, href, action]; the last step is the current item.
       A plain click runs the action in place; a modified click opens the href. */
    const breadcrumbs = (label, steps) => h('nav', { class: 'g2-breadcrumbs', 'aria-label': label },
      h('ol', null, steps.map(([text, href, go], i) => i === steps.length - 1 ? h('li', { 'aria-current': 'page' }, text)
        : h('li', null, href ? h('a', { class: 'g2-link-quiet', href, onclick: e => {
            if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            e.preventDefault(); go(); } }, text) : text))));
    const statHref = (x, target = stateTarget) => hrefFor({ view: 'stat', node: x === STAT ? '' : target(x) });
    function crumbs(id) {
      const ids = chain(id);
      return breadcrumbs('Poziția în structură', ids.map((x, i) => i < ids.length - 1
        ? [labelOf(x), statHref(x), () => focusNode(x)] : [labelOf(x)]));
    }

    /* the context for a tree: which records have which visible children. A matching record is linked under each of its
       parents, and every non-matching ancestor is linked too (as dimmed context), so the whole path stays visible */
    function buildCtx(items, filtered) {
      const matchSet = new Set(items), kids = new Map(), kidSet = new Map(), seen = new Set();
      const add = (par, r) => {
        if (!kids.has(par)) { kids.set(par, []); kidSet.set(par, new Set()); }
        if (!kidSet.get(par).has(r)) { kidSet.get(par).add(r); kids.get(par).push(r); }
      };
      const link = r => {
        if (seen.has(r)) return;
        seen.add(r);
        const pars = [...(r.p || [])];
        if (attachPar.has(r.f)) pars.push(attachPar.get(r.f));
        for (const c of pars) { add(c, r); const pr = byCif.get(c); if (pr) link(pr); }
      };
      for (const r of items) link(r);
      for (const list of kids.values()) list.sort((a, b) => coll.compare(a.n, b.n));
      const mm = new Map();
      const matchN = id => { if (!mm.has(id)) { let n = 0; for (const r of subtree(id)) if (matchSet.has(r)) n++; mm.set(id, n); } return mm.get(id); };
      return { kids, matchSet, cols: AUTH_COLS, filtered, matchN, relabel: new Map(), noCif: items.filter(r => !r.f),
        openAll: filtered && items.length > 0 && items.length <= 50,
        visible: id => !filtered || matchN(id) > 0 };
    }

    function renderStat(items, o = {}) {
      const filtered = o.filtered ?? isFiltered(), node = o.node ?? S.node;
      const ctx = buildCtx(items, filtered);
      if (!items.length) return emptyMsg();
      const tree = h('div', { class: 'tree' });
      const focus = node && nodeKnown(node) ? node : '';
      if (focus) {
        if (!ctx.visible(focus)) return h('div', null, crumbs(focus), h('p', { class: 'empty' }, 'Nicio potrivire în acest nod.'));
        // unique counts in the focused node: matching records and, next to them, every record it holds
        const scope = subtree(focus);
        let m = 0; for (const r of scope) if (ctx.matchSet.has(r)) m++;
        const info = h('p', { class: 'sub' }, filtered
          ? `În acest nod: ${plural(m, 'înregistrare potrivită', 'înregistrări potrivite')} din ${plural(scope.size, 'înregistrare', 'înregistrări')} (fiecare o singură dată). În tot setul de date: ${plural(items.length, 'potrivire', 'potriviri')}.`
          : `În acest nod: ${plural(scope.size, 'înregistrare', 'înregistrări')} (fiecare o singură dată).`);
        if (vnode.has(focus)) tree.append(vBranch(focus, ctx, true));
        else {
          const r = byCif.get(focus);
          if (ctx.kids.has(r.f)) tree.append(recordNode(r, ctx, true));
          else renderRecords(tree, [r], ctx, false);
        }
        return h('div', null, crumbs(focus), info, tree);
      }
      const top = vnode.get(STAT).nodes.filter(n => ctx.visible(n.id));
      for (const n of top) tree.append(vBranch(n.id, ctx));
      if (filtered && top.length === 1) tree.firstChild.open = true;
      return h('div', null, h('p', { class: 'sub' },
        'Structura statului după Constituție: puterile statului, apoi ierarhia ANAF (fiecare instituție apare sub ordonatorul principal de credite; cele cu doi ordonatori apar sub ambii), apoi administrația locală. Instituțiile de același tip se grupează automat. Numerele sunt înregistrări unice. Rândurile estompate sunt doar context (nu corespund filtrelor).'), tree);
    }

    /* console checks: `reachableRoots() === expectedRoots()`, and `descendantVisibility().failures` empty */
    window.explorer = {
      reachableRoots: () => [...subtree(STAT)].filter(r => r.f && !(r.p && r.p.length)).length,
      expectedRoots: () => rows.filter(r => r.f && !(r.p && r.p.length)).length,
      /* every record below an attached root: a search for its CIF must show the whole path, and the record must stay
         visible when the view is focused on any record or virtual group above it */
      descendantVisibility: () => {
        const failures = [], seenIds = new Set();
        let checked = 0;
        for (const [root] of ST.attach) for (const d of desc(root)) {
          if (seenIds.has(d.id)) continue;
          seenIds.add(d.id); checked++;
          const has = (t, sel) => !!t.querySelector(sel);
          const full = renderStat([d], { node: '', filtered: true });
          const path = chain(d.f || '').filter(x => x !== d.f && x !== STAT);
          const miss = [];
          if (!has(full, `[data-id="${d.id}"]`)) miss.push('record');
          for (const x of path) if (!has(full, vnode.has(x) ? `[data-vid="${x}"]` : `[data-cif="${x}"]`)) miss.push('path:' + x);
          for (const x of path) {
            if (x === STAT) continue;
            const f = renderStat([d], { node: x, filtered: true });
            if (!has(f, `[data-id="${d.id}"]`)) miss.push('focus:' + x);
          }
          if (miss.length) failures.push({ id: d.id, cif: d.f, name: d.n, missing: miss });
        }
        return { checked, failures };
      },
      /* map join check: how many counties / ANAF UAT roots / distinct locality labels reach a map shape */
      mapJoin: async () => {
        const g = await gis('romania-counties.geojson'), ix = {};
        for (const c of counties) ix[c] = await uatIdx(c);
        const feats = countyFeatures(g), found = new Set(feats.map(x => x.name).filter(Boolean));
        const roots = ST.uat.map(c => byCif.get(c)).filter(r => r && r.county && r.u);
        const bad = (c, u) => !(ix[c] && ix[c].join(u));
        const rootBad = roots.filter(r => bad(r.county, r.u)).map(r => `${r.county} | ${r.u}`);
        const labels = new Map(); for (const r of rows) if (r.county && r.u) labels.set(r.county + ' | ' + r.u, [r.county, r.u]);
        const labBad = [...labels].filter(([, [c, u]]) => bad(c, u)).map(([k]) => k);
        const seatMissing = Object.keys(SEATS).filter(c => !rows.some(r => r.county === c && r.u && uatKind(c, r.u) === 'seat'));
        return { counties: { matched: counties.filter(c => found.has(c)).length, total: counties.length, unmatched: counties.filter(c => !found.has(c)) },
          roots: { total: ST.uat.length, withLabel: roots.length, matched: roots.length - rootBad.length, unmatched: rootBad },
          labels: { total: labels.size, matched: labels.size - labBad.length, unmatched: labBad }, seatMissing, seats: Object.keys(SEATS).length };
      },
      csv: () => buildCsv(selection()),
      selectionIds: () => selection().map(r => r.id),
      get filtered() { return items; },
    };

    function browseHref(extra) {
      const p = browseParams();
      p.delete('n'); p.delete('v');
      for (const [k, v] of Object.entries(extra)) v ? p.set(k, v) : p.delete(k);
      return '#' + p;
    }
    function browseLink(label, href, fn, cls) {
      return h('a', { href, class: cls, onclick: e => {
        if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault(); fn();
      } }, label);
    }
    function directoryEntry(label, count, href, fn) {
      return h('li', null, browseLink([
        h('span', { class: 'label' }, label), h('span', { class: 'count' }, fmt(count)),
        h('span', { class: 'arrow', 'aria-hidden': 'true' }, '›')], href, fn));
    }
    function focusFamily(fam, cat, list) {
      if (list.length === 1) { openRecord(list[0]); return; }
      S.fam = fam; S.cat = fam === NO_FAMILY ? cat : '';
      S.node = ''; setView('fam'); window.scrollTo(0, 0);
    }
    function renderFamTree(items, directory = false) {
      if (!items.length) return emptyMsg();
      const NONE = NO_FAMILY;
      const matchSet = new Set(items);
      if (S.fam && !directory) {
        const nav = breadcrumbs('Poziția în tipuri',
          [['Tipuri de instituții', hrefFor({ fam: '', cat: '' }), () => { S.fam = ''; S.cat = ''; update(); }], [S.fam]]);
        const tree = h('div', { class: 'tree' }), ctx = buildCtx(items, isFiltered());
        const sorted = items.slice().sort((a, b) => coll.compare(a.county, b.county) || coll.compare(a.n, b.n));
        // A family is a peer group. Keep the focused results inside that group.
        if (items.length > SPLIT_MIN) splitByCounty(tree, sorted, ctx);
        else tree.append(leafTable(sorted, matchSet, ['n', 'where', 'site']));
        return h('div', null, nav, h('h2', null, S.fam), h('p', { class: 'sub' }, plural(items.length, 'înregistrare', 'înregistrări')), tree);
      }
      const byCat = new Map();                                  // category -> family -> rows
      for (const r of items) {
        const c = r.fam ? famCat.get(r.fam) : r.cat, f = r.fam || NONE;
        if (!byCat.has(c)) byCat.set(c, new Map());
        const m = byCat.get(c);
        if (!m.has(f)) m.set(f, []);
        m.get(f).push(r);
      }
      const countOf = m => [...m.values()].reduce((n, l) => n + l.length, 0);
      const tree = h('div', { class: 'tree' });
      for (const [cat, m] of [...byCat].sort((a, b) => countOf(b[1]) - countOf(a[1]))) {
        const fl = [...m].sort((a, b) => (a[0] === NONE) - (b[0] === NONE) || b[1].length - a[1].length);
        tree.append(branch({ cls: 'grp', label: cat, meta: `${plural(m.has(NONE) ? fl.length - 1 : fl.length, 'tip', 'tipuri')} · ${fmt(countOf(m))} înregistrări`,
          open: false,
          kids: box => {
            const links = h('ul', { class: 'directory' });
            chunked(links, fl, ([fam, list]) => directoryEntry(fam, list.length,
              list.length === 1 ? browseHref({ id: list[0].id }) : browseHref({ v: 'fam', fam, cat: fam === NONE ? cat : '' }),
              () => focusFamily(fam, cat, list)), 100, true, box);
            box.prepend(links);
          } }));
      }
      return h('div', null, h('p', { class: 'sub' },
        'Instituțiile de același fel sunt grupate (ex. toate Casele Corpului Didactic, câte una pe județ). Un tip stă sub categoria în care se încadrează majoritatea membrilor.'), tree);
    }

    /* ---------- county seats, coat-of-arms files, locality kinds ---------- */
    const SEATS = {   // county -> seat (41; București has sectors instead). Compared with `uatKey`, so old/new spelling both match
      'Alba': 'Alba Iulia', 'Arad': 'Arad', 'Arges': 'Pitesti', 'Bacau': 'Bacau', 'Bihor': 'Oradea', 'Bistrita Nasaud': 'Bistrita',
      'Botosani': 'Botosani', 'Braila': 'Braila', 'Brasov': 'Brasov', 'Buzau': 'Buzau', 'Calarasi': 'Calarasi', 'Caras Severin': 'Resita',
      'Cluj': 'Cluj-Napoca', 'Constanta': 'Constanta', 'Covasna': 'Sfantu Gheorghe', 'Dambovita': 'Targoviste', 'Dolj': 'Craiova',
      'Galati': 'Galati', 'Giurgiu': 'Giurgiu', 'Gorj': 'Targu Jiu', 'Harghita': 'Miercurea Ciuc', 'Hunedoara': 'Deva',
      'Ialomita': 'Slobozia', 'Iasi': 'Iasi', 'Ilfov': 'Buftea', 'Maramures': 'Baia Mare', 'Mehedinti': 'Drobeta-Turnu Severin',
      'Mures': 'Targu Mures', 'Neamt': 'Piatra Neamt', 'Olt': 'Slatina', 'Prahova': 'Ploiesti', 'Salaj': 'Zalau', 'Satu Mare': 'Satu Mare',
      'Sibiu': 'Sibiu', 'Suceava': 'Suceava', 'Teleorman': 'Alexandria', 'Timis': 'Timisoara', 'Tulcea': 'Tulcea', 'Valcea': 'Ramnicu Valcea',
      'Vaslui': 'Vaslui', 'Vrancea': 'Focsani' };
    const COD = { 'Alba': 'AB', 'Arad': 'AR', 'Arges': 'AG', 'Bacau': 'BC', 'Bihor': 'BH', 'Bistrita Nasaud': 'BN', 'Botosani': 'BT', 'Braila': 'BR',
      'Brasov': 'BV', 'Bucuresti': 'B', 'Buzau': 'BZ', 'Calarasi': 'CL', 'Caras Severin': 'CS', 'Cluj': 'CJ', 'Constanta': 'CT', 'Covasna': 'CV',
      'Dambovita': 'DB', 'Dolj': 'DJ', 'Galati': 'GL', 'Giurgiu': 'GR', 'Gorj': 'GJ', 'Harghita': 'HR', 'Hunedoara': 'HD', 'Ialomita': 'IL',
      'Iasi': 'IS', 'Ilfov': 'IF', 'Maramures': 'MM', 'Mehedinti': 'MH', 'Mures': 'MS', 'Neamt': 'NT', 'Olt': 'OT', 'Prahova': 'PH', 'Salaj': 'SJ',
      'Satu Mare': 'SM', 'Sibiu': 'SB', 'Suceava': 'SV', 'Teleorman': 'TR', 'Timis': 'TM', 'Tulcea': 'TL', 'Valcea': 'VL', 'Vaslui': 'VS', 'Vrancea': 'VN' };
    const stemaUrl = county => COD[county] ? `assets/steme-judete/${COD[county]}_${county.replace(/^(Bistrita|Caras) /, '$1-').replace(/ /g, '_')}.png` : '';
    /* a locality name without its kind prefix, spelling-tolerant: the ANAF data writes "î" as "i", the map as "a" */
    const KIND_RE = /^(municipiul|orasul|oras|comuna|sectorul|sector)\s+/;
    const KIND_CODE = { municipiul: 'm', orasul: 'o', oras: 'o', comuna: 'c', sectorul: 's', sector: 's' };
    const uatParts = s => { const n = norm(s), m = n.match(KIND_RE); return m ? [KIND_CODE[m[1]], n.slice(m[0].length)] : ['?', n]; };
    const looseName = n => n.replace(/[ia]/g, 'a').replace(/ /g, '');
    const uatKey = s => looseName(uatParts(s)[1]);
    const seatKey = county => SEATS[county] ? looseName(norm(SEATS[county])) : null;
    const uatKind = (county, u) => {
      const [k, n] = uatParts(u);
      if (u === UNKNOWN_UAT || u === UNKNOWN_SECTOR) return 'none';
      if (county === 'Bucuresti' && BUC_LABEL.has(u)) return BUC_LABEL.get(u);
      if (k === 's') return 's';
      if (k === 'm' && county !== 'Bucuresti' && looseName(n) === seatKey(county)) return 'seat';
      if (k === 'o' && looseName(n) === seatKey(county)) return 'seat';
      return k;
    };
    const UNKNOWN_UAT = '(localitate necunoscută)', UNKNOWN_SECTOR = 'Sector necunoscut';
    /* București records without a sector: most are national bodies with a seat in the capital. Sort them by level
       and kind from the name (first match wins), so they sit above the sectors instead of under "Fără localitate".
       This is a navigation grouping from the name, not a legal classification. */
    const BUC_CENTRAL = [
      ['Parlament, Președinție, autorități constituționale', /^(camera deputatilor|senatul|parlamentul romaniei|administratia prezidentiala|curtea (constitutionala|de conturi)|avocatul poporului|consiliul (legislativ|superior al magistraturii|economic si social))/],
      ['Ministere și Guvern', /^(ministerul|guvernul|secretariatul (general|de stat)|cancelaria|departamentul)\b/],
      ['Instanțe și parchete', /\b(judecatoria|tribunalul|curtea de apel|parchetul|inalta curte)\b/],
      ['Unități militare', /\b(unitatea militara|u m|um) ?\d/],
      ['Agenții naționale', /^agentia\b/],
      ['Autorități și consilii naționale', /^(autoritatea|oficiul|consiliul|comisia)\b/],
      ['Inspectorate și direcții generale', /^(inspectoratul general|inspectia|directia generala|garda nationala|politia romana|jandarmeria romana)\b/],
      ['Universități și academii', /^(universitatea|academia|scoala (nationala|superioara))\b/],
      ['Spitale', /^(spitalul|institutul clinic|centrul medical)\b/],
      ['Institute și centre naționale', /^(institutul|centrul national|centru national)\b|\bcercetare\b/],
      ['Companii și societăți naționale', /\b(compania nationala|societatea nationala|s a|sa|srl|s r l|regia autonoma|ra|c n)\b/],
      ['Federații și asociații', /^(federatia|asociatia|uniunea|fundatia|sindicatul|ordinul|colegiul (medicilor|farmacistilor))\b/],
    ];
    const BUC_MUNI = /\b(municipiului bucuresti|capitalei|municipal[ae]?|cgmb|primaria generala)\b/;   // a body of the capital
    const BUC_CITY = /^(administratia|directia|regia|compania|societatea|serviciul|centrul|teatrul|muzeul)\b.*\bbucuresti$/;
    const BUC_NATIONAL = /\b(nationala?|romana|romaniei|romane|romania)\b/;
    const BUC_LOCAL = /^(scoala|liceul|colegiul|gradinita|clubul|biblioteca|caminul|centrul de zi|directia de asistenta|serviciul public|administratia (serviciilor|parcuri|spitalelor)|comuna)\b/;
    const bucLevel = name => {
      const n = norm(name);
      if (BUC_LOCAL.test(n)) return ['none', UNKNOWN_SECTOR];
      const hit = BUC_CENTRAL.find(([, re]) => re.test(n));
      if (hit && !(BUC_MUNI.test(n) && !/^(ministerul|guvernul|parchetul|curtea|inalta|tribunalul)/.test(n))) return ['central', hit[0]];
      if (BUC_MUNI.test(n) || BUC_CITY.test(n) && !BUC_NATIONAL.test(n)) return ['muni', 'Instituții la nivelul Municipiului București'];
      if (BUC_NATIONAL.test(n)) return ['central', 'Alte instituții centrale'];
      return ['none', UNKNOWN_SECTOR];
    };
    const BUC_LABEL = new Map([...BUC_CENTRAL.map(([l]) => [l, 'central']), ['Alte instituții centrale', 'central'],
      ['Instituții la nivelul Municipiului București', 'muni']]);
    const unknownUat = (county, r) => county === 'Bucuresti' ? bucLevel(r.n)[1] : UNKNOWN_UAT;
    const GROUPS = [['central', 'Nivel central (sediu în București, sector necunoscut)'], ['muni', 'Nivel București (municipal și servicii deconcentrate)'],
      ['seat', 'Reședința de județ'], ['s', 'Sectoare'], ['m', 'Municipii'], ['o', 'Orașe'], ['c', 'Comune'], ['?', 'Altele'],
      ['none', 'Fără localitate']];

    function renderLocTree(items) {
      const byCounty = new Map();
      for (const r of items) {
        const k = r.county || '(județ necunoscut)', u = r.u || unknownUat(k, r);
        if (!byCounty.has(k)) byCounty.set(k, new Map());
        const m = byCounty.get(k);
        if (!m.has(u)) m.set(u, []);
        m.get(u).push(r);
      }
      const matchSet = new Set(items);
      const countOf = m => [...m.values()].reduce((n, l) => n + l.length, 0);
      const groupsOf = (county, m) => {
        const g = new Map(GROUPS.map(([c]) => [c, []]));
        for (const e of m) g.get(uatKind(county, e[0])).push(e);
        const rank = u => { const i = BUC_CENTRAL.findIndex(([l]) => l === u); return i < 0 ? BUC_CENTRAL.length : i; };
        return GROUPS.map(([c, label]) => [label, g.get(c).sort((a, b) => c === 'central' ? rank(a[0]) - rank(b[0]) : coll.compare(a[0], b[0])), c])
          .filter(x => x[1].length);
      };
      const groupNodes = (county, m, bx) => {
        for (const [label, uats, code] of groupsOf(county, m)) bx.append(branch({ cls: 'grp', label,
          meta: `${code === 'central' || code === 'muni' ? plural(uats.length, 'grupă', 'grupe') + ' · ' : plural(uats.length, 'localitate', 'localități') + ' · '}`
            + `${fmt(uats.reduce((n, e) => n + e[1].length, 0))} înregistrări`,
          open: !!S.uat || code === 'seat' || code === 's' || code === 'central',
          kids: box => chunked(box, uats, ([u, list]) => branch({
            label: u, meta: fmt(list.length), open: !!S.uat || list.length <= 3 && uats.length <= 8,
            kids: b2 => b2.append(leafTable(list.slice().sort((a, b) => coll.compare(a.n, b.n)), matchSet, ['n', 'cat', 'site'])) }), 100, true) }));
      };
      const tree = h('div', { class: 'tree' });
      const profile = S.county && counties.includes(S.county);
      if (profile) {
        const m = byCounty.get(S.county);
        if (m) groupNodes(S.county, m, tree); else tree.append(emptyMsg());
        return countyProfile(S.county, tree);
      }
      if (!byCounty.size) return emptyMsg();
      for (const [county, m] of [...byCounty].sort((a, b) => coll.compare(a[0], b[0]))) {
        tree.append(branch({ cls: 'grp', label: county, meta: `${plural(m.size, 'localitate', 'localități')} · ${fmt(countOf(m))} înregistrări`,
          open: !!S.county, kids: box => groupNodes(county, m, box) }));
      }
      return tree;
    }

    /* ---------- maps: inline SVG, GIS files loaded on first use ---------- */
    const GIS = {};
    const gis = name => GIS[name] || (GIS[name] = fetchJson('assets/gis/' + name).catch(e => { delete GIS[name]; throw e; }));
    const svgEl = (tag, props) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(props || {})) if (v != null && v !== false) el.setAttribute(k, v);
      return el;
    };
    const mapError = box => box.replaceChildren(h('p', { class: 'maperr', role: 'status' },
      'Harta nu a putut fi încărcată. Lista cu numere de mai jos funcționează în continuare.'));
    const roName = s => s.replace(/ş/g, 'ș').replace(/Ş/g, 'Ș').replace(/ţ/g, 'ț').replace(/Ţ/g, 'Ț');
    const titleCase = s => roName(s).toLowerCase().replace(/(^|[\s\-(])(\p{L})/gu, (_, a, b) => a + b.toUpperCase());

    /* polygons: [[ring, ...], ...], ring = [[lon, lat], ...]. Equirectangular, x scaled by cos(mid latitude). */
    function project(polys, W = 1000) {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of polys) for (const r of p) for (const [x, y] of r) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      const k = Math.cos((y0 + y1) / 2 * Math.PI / 180), s = W / ((x1 - x0) * k);
      return { w: W, h: Math.round((y1 - y0) * s), pt: ([x, y]) => [(x - x0) * k * s, (y1 - y) * s] };
    }
    const f1 = n => Math.round(n * 10) / 10;
    function pathOf(polys, pj) {
      let d = '';
      for (const p of polys) for (const r of p) {
        let last = '', seg = '';
        for (const q of r) { const [x, y] = pj.pt(q), t = f1(x) + ',' + f1(y); if (t !== last) { seg += (seg ? 'L' : 'M') + t; last = t; } }
        if (seg.includes('L')) d += seg + 'Z';
      }
      return d;
    }

    /* quantile classes over the non-zero values: returns { cls(v), legend: [[class, text]] } */
    function classes(vals) {
      // quantiles of the distinct values: skewed counts (many UATs with 2-4 records) still give 5 classes
      const nz = [...new Set(vals.filter(v => v > 0))].sort((a, b) => a - b);
      const br = [];
      for (let i = 0; i < 5 && nz.length; i++) { const b = nz[Math.floor(nz.length * i / 5)]; if (!br.length || b > br[br.length - 1]) br.push(b); }
      const cls = v => { if (!(v > 0)) return 0; let c = 1; br.forEach((b, i) => { if (v >= b) c = i + 1; }); return c; };
      const legend = br.map((b, i) => [i + 1, i === br.length - 1 ? (b === nz[nz.length - 1] ? fmt(b) : `${fmt(b)}–${fmt(nz[nz.length - 1])}`)
        : (br[i + 1] - 1 === b ? fmt(b) : `${fmt(b)}–${fmt(br[i + 1] - 1)}`)]);
      if (vals.some(v => !(v > 0))) legend.unshift([0, '0']);
      return { cls, legend };
    }
    const legendEl = (legend, measure) => h('div', { class: 'legend', role: 'group', 'aria-label': 'Legendă: ' + measure },
      h('span', null, measure + ':'), legend.map(([c, t]) => h('span', { class: 'lg' }, h('span', { class: 'sw q' + c }), t)));

    /* one choropleth. shapes: [{ d, count, name, pick }]; pick = null when the shape is not selectable */
    function choropleth(shapes, pj, measure, selectedName, labels) {
      const { cls, legend } = classes(shapes.map(s => s.count));
      const svg = svgEl('svg', { class: 'map', viewBox: `0 0 ${pj.w} ${pj.h}`, role: 'group', 'aria-label': measure });
      for (const s of shapes) {
        const label = `${s.name}: ${fmt(s.count)} înregistrări`;
        const p = svgEl('path', { d: s.d, class: 'q' + cls(s.count) + (s.name === selectedName ? ' sel' : ''), 'aria-label': label });
        const t = svgEl('title'); t.textContent = label; p.append(t);
        if (s.pick) {
          p.setAttribute('tabindex', '0'); p.setAttribute('role', 'button');
          p.addEventListener('click', s.pick);
          p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); s.pick(); } });
        }
        svg.append(p);
      }
      if (labels) {
        const g = svgEl('g', { class: 'labels', 'aria-hidden': 'true' });
        for (const l of labels) {
          const t = svgEl('text', { x: f1(l.x), y: f1(l.y), class: l.cls, 'font-size': l.fs });
          t.textContent = l.text; g.append(t);
        }
        svg.append(g);
      }
      return h('div', null, svg, legendEl(legend, measure));
    }

    /* counties */
    const countyCounts = () => { const m = new Map(); for (const r of items) if (r.county) m.set(r.county, (m.get(r.county) || 0) + 1); return m; };
    const countyFeatures = g => g.features.map(f => ({ f, name: counties.find(c => norm(c) === norm(f.properties.name.replace(/^Municipiul /, ''))) || null }));
    const openCounty = c => { clearFilters({ county: c, web: S.web }); closeDialogSilently(); setView('loc'); window.scrollTo(0, 0); };
    function countyMap(box) {
      gis('romania-counties.geojson').then(g => {
        if (!box.isConnected) return;
        const counts = countyCounts(), feats = countyFeatures(g);
        const polysOf = f => f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
        const all = feats.flatMap(x => polysOf(x.f)), pj = project(all);
        const shapes = feats.filter(x => x.name).map(x => ({ d: pathOf(polysOf(x.f), pj), count: counts.get(x.name) || 0, name: x.name, pick: () => openCounty(x.name) }));
        box.replaceChildren(choropleth(shapes, pj, 'Înregistrări pe județ'));
      }).catch(e => { console.error('county map', e); if (box.isConnected) mapError(box); });
    }

    /* UATs: join an ANAF locality label to a shape of the county map file, by name. Tiers: exact, spelling-tolerant, one edit apart.
       One file per county (assets/gis/uat/<COD>.json, built by scripts/build_uat_maps.py), loaded on first use. */
    const UAT_IX = {};
    function buildUatIndex(file) {
      const list = file.uats.map(u => { const [k, n] = uatParts(u.n); return { g: u, k, n, ln: looseName(n) }; });
      const near = (a, b) => {
        if (a === b) return true;
        if (Math.abs(a.length - b.length) > 1) return false;
        let i = 0; while (i < a.length && a[i] === b[i]) i++;
        return a.length === b.length ? a.slice(i + 1) === b.slice(i + 1) : a.length > b.length ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
      };
      const cache = new Map();
      const join = u => {
        if (cache.has(u)) return cache.get(u);
        const [k, n] = uatParts(u), ln = looseName(n);
        const pick = l => l.find(e => e.k === k) || (l.length === 1 ? l[0] : null);
        const res = pick(list.filter(e => e.n === n)) || pick(list.filter(e => e.ln === ln))
          || (c => c.length === 1 ? c[0] : null)(list.filter(e => near(e.ln, ln) && (e.k === k || k === '?')));
        cache.set(u, res);
        return res;
      };
      return { join, list };
    }
    const uatIdx = county => !COD[county] ? Promise.resolve(null)
      : UAT_IX[county] || (UAT_IX[county] = gis(`uat/${COD[county]}.json`).then(buildUatIndex).catch(e => { delete UAT_IX[county]; throw e; }));

    /* map labels: placed greedily by priority (seat, municipii and sectors, towns, then communes by count and size); a label that
       would overlap a placed one is left out, and its name stays in the shape's tooltip */
    const LABEL_FS = { seat: 13, m: 11, s: 11, o: 10, c: 8.5 };
    function placeLabels(labels) {
      const boxes = [], out = [];
      for (const l of labels.sort((a, b) => a.prio - b.prio || b.count - a.count || b.size - a.size)) {
        const w = l.text.length * l.fs * 0.56 + 2, ht = l.fs + 2;
        const b = [l.x - w / 2, l.y - ht / 2, l.x + w / 2, l.y + ht / 2];
        if (boxes.some(o => b[0] < o[2] && o[0] < b[2] && b[1] < o[3] && o[1] < b[3])) continue;
        boxes.push(b); out.push(l);
      }
      return out;
    }

    function uatMap(county, box, note) {
      uatIdx(county).then(ix => {
        if (!box.isConnected) return;
        if (!ix) { box.replaceChildren(h('p', { class: 'maperr' }, 'Nu există hartă pentru acest județ.')); return; }
        const counts = new Map();
        let noU = 0;
        for (const r of rows) if (r.county === county && pass(r, 'uat')) { if (r.u) counts.set(r.u, (counts.get(r.u) || 0) + 1); else noU++; }
        const shapes = new Map();                                  // entry -> { count, best label }
        let unmatched = 0;
        for (const [u, n] of counts) {
          const e = ix.join(u);
          if (!e) { unmatched++; continue; }
          const s = shapes.get(e) || { count: 0, best: u, bestN: 0 };
          s.count += n; if (n > s.bestN) { s.best = u; s.bestN = n; }
          shapes.set(e, s);
        }
        const pj = project(ix.list.flatMap(e => e.g.g), 480);
        const seat = seatKey(county), labels = [];
        const out = ix.list.map(e => {
          const s = shapes.get(e), d = pathOf(e.g.g, pj);
          const kind = (e.k === 'm' || e.k === 'o') && e.ln === seat ? 'seat' : e.k;
          const [x, y] = pj.pt(e.g.p), ring = e.g.g[0][0].map(pj.pt);
          const size = (Math.max(...ring.map(q => q[0])) - Math.min(...ring.map(q => q[0]))) * (Math.max(...ring.map(q => q[1])) - Math.min(...ring.map(q => q[1])));
          labels.push({ text: e.g.l, x, y, fs: LABEL_FS[kind] || 8.5, cls: 'k-' + kind, prio: ['seat', 'm', 's', 'o'].indexOf(kind) + 1 || 9,
            count: s ? s.count : 0, size });
          return { d, count: s ? s.count : 0, name: s ? s.best : e.g.l, pick: s ? () => { S.uat = s.best; update(); } : null };
        });
        if (!out.length) { box.replaceChildren(h('p', { class: 'maperr' }, 'Nu există formă pe hartă pentru acest județ.')); return; }
        box.replaceChildren(choropleth(out, pj, 'Înregistrări pe localitate', S.uat, placeLabels(labels)));
        note.textContent = `Pe hartă: ${fmt(shapes.size)} din ${fmt(counts.size)} localități cu înregistrări`
          + (unmatched ? ` (${fmt(unmatched)} fără formă pe hartă, vezi lista)` : '') + `. Fără localitate: ${plural(noU, 'înregistrare', 'înregistrări')}.`;
      }).catch(e => { console.error('uat map', e); if (box.isConnected) mapError(box); });
    }

    /* county profile: coat of arms, name and counts on the left above the locality tree; the locality map in a column on the right */
    function countyProfile(county, tree) {
      const all = rows.filter(r => r.county === county), noU = all.filter(r => !r.u).length;
      const locs = new Set(all.filter(r => r.u).map(r => r.u));
      const mapBox = h('div', null, h('p', { class: 'sub', role: 'status' }, 'Se încarcă harta…'));
      const note = h('p', { class: 'sub', role: 'status' });
      const img = stemaUrl(county) ? h('img', { src: stemaUrl(county), alt: `Stema județului ${county}`, width: 72, height: 72,
        onerror: e => e.target.remove() }) : null;
      uatMap(county, mapBox, note);
      return h('section', { class: 'cprof', 'aria-label': 'Profil județ' },
        h('div', { class: 'prof' }, img, h('div', { class: 'prof-head' },
          h('h2', null, county === 'Bucuresti' ? 'București' : county),
          h('p', { class: 'sub' }, `${plural(all.length, 'înregistrare', 'înregistrări')} · ${plural(locs.size, 'localitate', 'localități')} · ${fmt(noU)} fără localitate`
            + (items.length !== all.length ? ` · ${fmt(items.length)} potrivite cu filtrele` : '')),
          h('button', { class: 'g2-btn g2-secondary', type: 'button', onclick: () => { clearFilters(); setView('acasa'); window.scrollTo(0, 0); } }, '← Toate județele'),
          S.uat ? [' ', h('button', { class: 'g2-btn g2-secondary', type: 'button', onclick: () => { S.uat = ''; update(); } }, `× ${S.uat}`)] : null)),
        h('div', { class: 'cprof-map', role: 'region', 'aria-label': 'Harta localităților' }, mapBox, note),
        h('div', { class: 'cprof-tree' }, tree));
    }

    /* ---------- landing page: original shortcuts and type grid, new directories, county map ---------- */
    const HOME_HIDDEN = new Set(['neclasificate', 'fara-anaf']);
    let homeCat = '';                                        // the open category tab on the landing page
    function renderHome(items) {
      const ctx = buildCtx(items, isFiltered());
      const byFam = new Map();
      for (const r of items) if (r.fam) {
        if (!byFam.has(r.fam)) byFam.set(r.fam, []);
        byFam.get(r.fam).push(r);
      }
      const families = [...byFam].sort((a, b) => b[1].length - a[1].length || coll.compare(a[0], b[0]));
      const familyHref = (f, list) => list.length === 1 ? browseHref({ id: list[0].id }) : browseHref({ v: 'fam', fam: f, cat: '' });
      const familyLink = (f, list, cls) => browseLink(f, familyHref(f, list), () => focusFamily(f, '', list), cls);
      const shortcut = (link, count) => h('span', null, link, h('span', { class: 'count' }, fmt(count)));
      const stateMatches = n => [...subtree(n.id)].filter(r => ctx.matchSet.has(r));
      const stateHref = (n, matches) => matches.length === 1 ? browseHref({ id: matches[0].id }) : browseHref({ v: 'stat', n: stateTarget(n.id) });
      // the leftover roots (unclassified, no ANAF match) stay in the "Structura statului" view only
      const stateLinks = vnode.get(STAT).nodes.filter(n => ctx.visible(n.id) && !HOME_HIDDEN.has(n.id)).map(n => {
        const matches = stateMatches(n);
        return shortcut(browseLink(n.label, stateHref(n, matches), () => focusNode(n.id)), matches.length);
      });
      const overview = h('section', { class: 'home-sec', 'aria-label': 'Structura statului' },
        h('div', { class: 'ov-body' }, stateLinks.length ? h('div', { class: 'ov-g' }, stateLinks) : null));
      const byCat = new Map();
      for (const [f, list] of families) {
        const cat = famCat.get(f);
        if (!byCat.has(cat)) byCat.set(cat, []);
        byCat.get(cat).push([f, list]);
      }
      const catN = list => list.reduce((n, [, records]) => n + records.length, 0);
      // categories as a row of tabs; the open one lists its types in the panel under the row
      const cats = [...byCat].sort((a, b) => catN(b[1]) - catN(a[1]));
      if (!byCat.has(homeCat)) homeCat = '';
      const panel = h('div', { class: 'cat-panel', id: 'cat-panel', role: 'region' });

      $('ftoggle').setAttribute('aria-label', nAct ? `Filtre, ${nAct} active` : 'Filtre');
      $('stats').textContent = fmt(items.length);
      $('stats').title = `${fmt(items.length)} din ${fmt(rows.length)} înregistrări`;
      $('csv-msg').textContent = '';
      $('toolbar').hidden = S.view === 'acasa';
      $('filters').hidden = S.view === 'acasa';
      $('home-link').toggleAttribute('aria-current', S.view === 'acasa');
      if (S.view === 'acasa') $('home-link').setAttribute('aria-current', 'page');
      $('list-link').toggleAttribute('aria-current', S.view === 'list');
      if (S.view === 'list') $('list-link').setAttribute('aria-current', 'page');
      $('list-link').href = browseHref({ v: 'list' });
      refreshViewLinks();
      $('menu-status').textContent = S.web || S.review || S.srcs.has('nocif') ? ' •' : '';
      results.replaceChildren({ acasa: renderHome, list: renderList, stat: renderStat, fam: renderFamTree, loc: renderLocTree }[S.view](items));
      syncHash();
    }

    /* ---------- URL hash: view, focused node, filters, open record (#v=stat&n=4266456&q=spital&id=A4400956) ---------- */
    const HASH_KEYS = { v: 'view', n: 'node', q: 'q', cat: 'cat', fam: 'fam', k: 'county', u: 'uat', sort: 'sort' };
    let lastHash = '', lastNav = '', lastKey = '';
    const navKey = () => S.view + '|' + (S.view === 'stat' ? S.node : S.view === 'fam' ? S.fam + '|' + S.cat : '');
    function browseParams() {                           // everything except the open record
      const p = new URLSearchParams();
      if (S.view !== 'list' && S.view !== 'acasa') p.set('v', S.view);
      if (S.view === 'stat' && S.node) p.set('n', S.node);
      for (const [k, f] of Object.entries(HASH_KEYS)) if (k !== 'v' && k !== 'n' && S[f] && !(k === 'sort' && S.sort === 'n')) p.set(k, S[f]);
      if (S.srcs.size) p.set('s', [...S.srcs].join(','));
      if (S.srcs.size > 1 && S.srcMode === 'any') p.set('sm', 'any');
      if (!S.web) p.set('web', '0');
      if (S.review) p.set('review', '1');
      return p;
    }
    function syncHash(mode) {                           // mode: 'push' (record opened), 'replace' (record closed in place)
      let p = browseParams();
      if (S.view === 'acasa' && p.toString()) p = new URLSearchParams([['v', 'acasa'], ...p]);
      if (S.view === 'list' && !p.toString()) p.set('v', 'list');          // an empty hash means the landing page
      lastKey = p.toString();
      if (S.id) p.set('id', S.id);
      const hash = p.toString() ? '#' + p : '';
      if (hash === location.hash) { lastHash = hash; return; }
      const nav = navKey();                           // a new view or focused group gets its own history entry
      const url = hash || location.pathname + location.search;
      try {
        if (mode === 'push') {
          const cur = history.state, curHasId = /(^#|&)id=/.test(location.hash);
          history.pushState({ k: curHasId ? ((cur && cur.k) || 0) + 1 : 1, direct: curHasId && !!(cur && cur.direct) }, '', url);
        } else if (mode === 'replace') history.replaceState(null, '', url);
        else history[nav !== lastNav && lastNav ? 'pushState' : 'replaceState'](null, '', url);
      } catch (e) {}
      lastHash = location.hash; lastNav = nav;
    }
    function applyHash() {
      const p = new URLSearchParams(location.hash.slice(1));
      clearFilters(); S.view = location.hash.length > 1 ? 'list' : 'acasa'; S.node = '';
      for (const [k, f] of Object.entries(HASH_KEYS)) if (p.has(k)) S[f] = p.get(k);
      if (!['acasa', 'list', 'stat', 'fam', 'loc'].includes(S.view)) S.view = 'list';
      if (S.node && !nodeKnown(S.node)) S.node = '';
      if (!['n', 'dc'].includes(S.sort)) S.sort = 'n';
      for (const k of (p.get('s') || '').split(',')) if (srcTest[k]) S.srcs.add(k);
      S.srcMode = p.get('sm') === 'any' ? 'any' : 'all';
      S.web = p.get('web') !== '0';
      S.review = p.get('review') === '1';
      S.id = p.get('id') || '';
      el.q.value = S.q; el.web.checked = S.web; el.review.checked = S.review; el.sort.value = S.sort;
      refreshViewLinks();
      lastNav = navKey();
    }
    const onNav = () => {
      if (location.hash === lastHash) return;
      const p = new URLSearchParams(location.hash.slice(1)), id = p.get('id') || '';
      p.delete('id');
      if (p.toString() !== lastKey) { applyHash(); update(); } else S.id = id;
      applyId(id);
      lastHash = location.hash;
    };

    /* ---------- wiring (runs once, only after the data has loaded and rendered) ---------- */
    const viewLinks = [...document.querySelectorAll('.g2-nav [data-view]')];
    const refreshViewLinks = () => viewLinks.forEach(x => {
      x.href = browseHref({ v: x.dataset.view });
      if (x.dataset.view === S.view) x.setAttribute('aria-current', 'page');
      else x.removeAttribute('aria-current');
    });
    function leaveHome() {                                   // a filter or a search on the landing page opens the list
      if (S.view !== 'acasa') return;
      S.view = 'list';
      refreshViewLinks();
    }
    function setView(view) {
      if (view === 'acasa') { clearFilters(); S.node = ''; S.id = ''; }
      S.view = view;
      refreshViewLinks();
      update();
    }
    on($('home-link'), 'click', e => {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault(); closeDialogSilently(); setView('acasa'); window.scrollTo(0, 0);
    });
    // the skip link moves focus without a hash change, because the hash holds the view state
    on(document.querySelector('.g2-skip-link'), 'click', e => { e.preventDefault(); $('main').focus(); });
    on($('list-link'), 'click', e => {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault(); $('navmore').open = false; S.node = ''; setView('list');
    });
    on(document, 'click', e => { if (!$('navmore').contains(e.target)) $('navmore').open = false; });
    on($('navmore'), 'keydown', e => {
      if (e.key === 'Escape') { $('navmore').open = false; $('navmore').querySelector('summary').focus(); }
    });
    srcBox.querySelectorAll('[data-mode]').forEach(b => on(b, 'click', () => { leaveHome(); S.srcMode = b.dataset.mode; update(); }));
    on(document, 'click', e => { if (!srcBox.contains(e.target)) srcBox.open = false; });
    on(srcBox, 'toggle', () => {              // right-aligned by default; nudge back inside the viewport
      const panel = srcBox.querySelector('.panel');
      panel.style.right = '';
      if (!srcBox.open || getComputedStyle(panel).position !== 'absolute') return;
      panel.style.right = '0px';
      const left = panel.getBoundingClientRect().left;
      if (left < 8) panel.style.right = `${left - 8}px`;
    });
    on(srcBox, 'keydown', e => { if (e.key === 'Escape') { srcBox.open = false; srcBox.querySelector('summary').focus(); } });
    let timer;
    on(el.q, 'input', () => { clearTimeout(timer); timer = setTimeout(() => { leaveHome(); S.q = el.q.value; update(); }, 150); });
    on(el.cat, 'change', () => { leaveHome(); S.cat = el.cat.value; update(); });
    on(el.fam, 'change', () => { leaveHome(); S.fam = el.fam.value; update(); });
    on(el.county, 'change', () => { leaveHome(); S.county = el.county.value; S.uat = ''; update(); });
    on(el.uat, 'change', () => { leaveHome(); S.uat = el.uat.value; update(); });
    on(el.web, 'change', () => { S.web = el.web.checked; update(); });
    on(el.review, 'change', () => { leaveHome(); S.review = el.review.checked; update(); });
    on(el.noanaf, 'change', () => { leaveHome(); el.noanaf.checked ? S.srcs.add('nocif') : S.srcs.delete('nocif'); update(); });
    on(el.sort, 'change', () => { S.sort = el.sort.value; update(); });
    on($('reset'), 'click', () => { clearFilters(); update(); });
    on($('ftoggle'), 'click', () => {
      const open = $('fmore').classList.toggle('open');
      $('ftoggle').setAttribute('aria-expanded', String(open));
    });
    viewLinks.forEach(b => on(b, 'click', e => {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault(); $('navmore').open = false; setView(b.dataset.view);
    }));
    on(window, 'popstate', onNav);
    on(window, 'hashchange', onNav);

    applyHash();
    update();
    wires.forEach(f => f());
    started = true;
    $('filters').removeAttribute('inert'); $('navmore').removeAttribute('inert');
    $('toolbar').hidden = S.view === 'acasa';
    main.setAttribute('aria-busy', 'false');
    if (S.id) {                                          // a directly loaded record URL: open it, keep this entry as the base
      applyId(S.id);
      try { history.replaceState({ k: 0, direct: true }, '', location.href); } catch (e) {}
    }
  }

  load();
})();
</script>
</body>
</html>
