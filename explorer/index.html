<!doctype html>
<html lang="ro" data-g2-scheme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instituții publice &middot; org.gov2.ro</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
<link rel="shortcut icon" href="assets/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="org.gov2.ro" />
<link rel="manifest" href="assets/favicon/site.webmanifest" />
<link rel="stylesheet" href="assets/gov2/gov2.css">
<link rel="stylesheet" href="assets/gov2/fonts.css">

<style>
@layer app {
  /* Project styles on the gov2 design system (DS), v0.13.0: assets/gov2/ is an unedited copy (see CLAUDE.md).
     Local components keep their own short names; new ones take the prefix org-. Colours come from the --g2-* tokens,
     so the DS dark scheme (data-g2-scheme="auto" on <html>) also covers this page. */
  :root {
    --muted: rgb(var(--g2-color-text-muted)); --line: rgb(var(--g2-color-line)); --text: rgb(var(--g2-color-text));
    --sunken: rgb(var(--g2-color-surface-sunken)); --page: rgb(var(--g2-color-page)); --link: rgb(var(--g2-color-link));
    /* county map: a sequential blue ramp, 5 quantile classes light -> dark (more records = darker); m0 = no records.
       The DS chart ramp has 4 categorical steps, so the map keeps its own. */
    --org-map-0: #e5e6e7; --org-map-1: #d2e2f1; --org-map-2: #8fb8e0; --org-map-3: #1d70b8; --org-map-4: #0b3d91; --org-map-5: #06224f;
  }
  /* dark: fewer records recede toward the page; more records = lighter. Same selectors as the DS dark scheme. */
  :root[data-g2-scheme=dark] { --org-map-0: #2b3033; --org-map-1: #17314f; --org-map-2: #1d5a96; --org-map-3: #4f94d8; --org-map-4: #9cc3f6; --org-map-5: #d0e5fb; }
  @media (prefers-color-scheme: dark) {
    :root[data-g2-scheme=auto] { --org-map-0: #2b3033; --org-map-1: #17314f; --org-map-2: #1d5a96; --org-map-3: #4f94d8; --org-map-4: #9cc3f6; --org-map-5: #d0e5fb; }
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  h1, h2, h3 { line-height: var(--g2-line-height-heading); }
  code { font-family: var(--g2-font-mono); font-size: .9em; }
  :where(button, select, input):not(.g2-btn, .g2-input) { font: inherit; color: inherit; }

  /* header: the DS black bar. The filters sit below it, on the page surface, and only they stay on screen. */
  .g2-header .title { gap: var(--g2-space-2) var(--g2-space-4); }
  .g2-header h1 { margin: 0; font: inherit; }
  #stats { font: var(--g2-font-size-label)/1.3 var(--g2-font-mono); color: rgb(var(--g2-color-on-header-muted)); }
  .g2-header .grow { flex: 1; }
  .txtbtn { min-height: 44px; padding: 0 var(--g2-space-2); border: 0; background: none; cursor: pointer;
            color: rgb(var(--g2-color-on-header)); font-size: var(--g2-font-size-meta); font-weight: 600; }
  .txtbtn:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
  .g2-header .navmore > summary { min-height: 44px; border-color: rgb(var(--g2-color-on-header-muted)); background: none; color: rgb(var(--g2-color-on-header));
                       font-size: var(--g2-font-size-meta); font-weight: 600; }
  .navmore .panel { width: 290px; color: var(--text); }
  .navmore .chk { white-space: normal; }
  .menu-status { color: rgb(var(--g2-color-header-accent)); font-weight: 600; }

  .org-filterbar { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--line);
                   padding-block: var(--g2-space-2); }
  .org-filterbar:has(> .g2-container > .filters[hidden]) { display: none; }

  /* controls: one wrapping row on desktop (.fmore dissolves into it), disclosure on phones */
  .filters { display: flex; flex-wrap: wrap; gap: var(--g2-space-2); align-items: center; }
  .filters[hidden] { display: none; }
  .filters[inert] { opacity: .55; }
  .filters > * { min-width: 0; }
  #q { flex: 2 1 260px; order: 0; }
  .fmore { display: contents; }
  .fmore > * { order: 1; }
  .fmore > select { flex: 1 1 150px; }
  .fmore > .multi { flex: 1 1 150px; }
  #ftoggle { display: none; }
  #reset { order: 2; }
  .filters .g2-input { width: 100%; }
  .filters input[type=search]::placeholder { color: var(--muted); opacity: 1; }
  .multi { position: relative; }
  .multi > summary { min-height: 40px; padding: 0 2.5rem 0 8px; border: var(--g2-border-width-control) solid rgb(var(--g2-color-control-border));
    background: rgb(var(--g2-color-control-bg)); display: flex; align-items: center; cursor: pointer; list-style: none; position: relative; }
  .multi > summary::-webkit-details-marker { display: none; }
  /* the arrow of the DS select (select.g2-input), so that the disclosure filters match the selects */
  .multi > summary::after { content: ""; position: absolute; right: 1rem; top: 50%; width: .9em; height: .45em; margin-top: -.225em;
    background: linear-gradient(45deg, transparent 50%, currentColor 50%) left / .45em .45em no-repeat,
                linear-gradient(135deg, currentColor 50%, transparent 50%) right / .45em .45em no-repeat; }
  @media (forced-colors: active) { .multi > summary::after { content: "▾"; width: auto; height: auto; margin-top: -.6em; background: none; } }
  .multi > summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .multi .panel { position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; width: 300px; max-width: calc(100vw - 16px); padding: var(--g2-space-2) var(--g2-space-3);
    background: var(--page); border: var(--g2-border-width-control) solid rgb(var(--g2-color-control-border)); }
  .multi .opt { display: flex; align-items: center; gap: var(--g2-space-2); min-height: 32px; cursor: pointer; font-size: var(--g2-font-size-meta); }
  .multi .opt .count { margin-left: auto; }
  input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: var(--text); }
  .seg { display: flex; margin-top: var(--g2-space-2); border: var(--g2-border-width-control) solid rgb(var(--g2-color-control-border)); }
  .seg button { flex: 1; min-height: 40px; padding: 4px 8px; border: 0; background: none; cursor: pointer; font-size: var(--g2-font-size-meta); }
  .seg button[aria-pressed=true] { background: var(--text); color: var(--page); font-weight: 600; }
  .multi .hint { margin: var(--g2-space-2) 0 0; font-size: var(--g2-font-size-label); color: var(--muted); }
  .chk { display: flex; gap: var(--g2-space-2); align-items: center; font-size: var(--g2-font-size-meta); flex: none; min-height: 40px; }
  .fbadge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
            background: var(--text); color: var(--page); font: var(--g2-font-size-label)/1 var(--g2-font-mono); }
  .fbadge:empty { display: none; }
  .menu-link { display: block; width: 100%; min-height: 40px; padding: var(--g2-space-2) 0; }

  main { padding-block: var(--g2-space-4) var(--g2-space-6); }
  .empty, .notice { padding: var(--g2-space-6) var(--g2-space-3); text-align: center; color: var(--muted); }
  .notice .g2-btn { margin-top: var(--g2-space-3); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--g2-space-2) var(--g2-space-3); margin: 0 0 var(--g2-space-3);
             font-size: var(--g2-font-size-meta); color: var(--muted); }
  .toolbar[hidden] { display: none; }
  .sortby { display: flex; gap: var(--g2-space-2); align-items: center; }
  .sortby[hidden] { display: none; }
  .sortby select { width: auto; }
  .toolbar .grow { margin-left: auto; }

  /* landing page */
  .home-sec { margin: 0 0 var(--g2-space-6); }
  .home-sec > h2 { font-size: var(--g2-font-size-heading-section); margin: 0 0 var(--g2-space-3); }
  .ov-g { display: flex; flex-wrap: wrap; gap: var(--g2-space-1) var(--g2-space-4); align-items: baseline; margin: var(--g2-space-2) 0; }
  .ov-g > span { min-width: 0; max-width: 100%; }
  .ov-g a { overflow-wrap: anywhere; }
  .ov-g .count { margin-left: 4px; }
  .cat-tabs { display: flex; flex-wrap: wrap; gap: 0 var(--g2-space-4); border-bottom: 1px solid var(--line); }
  .cat-tab { display: inline-flex; gap: 6px; align-items: baseline; min-height: 44px; padding: 10px 0 8px; margin-bottom: -1px; border: 0;
             border-bottom: 4px solid transparent; background: none; color: var(--link); font: inherit; font-size: var(--g2-font-size-meta); cursor: pointer;
             text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
  .cat-tab:hover { text-decoration-thickness: 3px; }
  .cat-tab[aria-expanded=true] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; text-decoration: none; }
  .cat-panel { padding-top: var(--g2-space-3); }
  .cat-panel[hidden] { display: none; }
  .cat-panel .famgrid { margin: 0; }
  .famgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--g2-space-1) var(--g2-space-4); margin: var(--g2-space-1) 0 var(--g2-space-2) 18px; font-size: var(--g2-font-size-meta); }
  .famgrid .it { display: flex; gap: var(--g2-space-2); align-items: baseline; min-width: 0; }
  .famgrid .link { min-width: 0; overflow-wrap: anywhere; }
  .directory { margin: 0; padding: 0; list-style: none; }
  .directory li { border-bottom: 1px solid var(--line); }
  .directory a { display: flex; gap: var(--g2-space-3); align-items: baseline; min-height: 44px; padding: 10px 4px; color: var(--text); text-decoration: none; }
  .directory a:hover { text-decoration: underline; text-decoration-thickness: 3px; }
  .directory .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .directory .arrow { color: var(--muted); }

  /* maps */
  .maprow { display: flex; flex-wrap: wrap; gap: var(--g2-space-4) var(--g2-space-5); align-items: flex-start; }
  .mapcol { flex: 1 1 360px; min-width: 0; max-width: 640px; }
  .mapside { flex: 1 1 260px; min-width: 0; }
  svg.map { display: block; width: 100%; height: auto; max-height: 70vh; }
  svg.map path { stroke: var(--page); stroke-width: .8; stroke-linejoin: round; fill: var(--org-map-0); vector-effect: non-scaling-stroke; }
  svg.map path.q1 { fill: var(--org-map-1); } svg.map path.q2 { fill: var(--org-map-2); } svg.map path.q3 { fill: var(--org-map-3); }
  svg.map path.q4 { fill: var(--org-map-4); } svg.map path.q5 { fill: var(--org-map-5); }
  svg.map path[tabindex] { cursor: pointer; }
  svg.map path[tabindex]:hover { stroke: var(--text); stroke-width: 1.6; }
  svg.map path:focus { outline: none; }
  svg.map path:focus-visible { stroke: rgb(var(--g2-color-focus)); stroke-width: 4; }
  svg.map path.sel { stroke: var(--text); stroke-width: 2.4; }
  .legend { display: flex; flex-wrap: wrap; gap: var(--g2-space-1) var(--g2-space-4); margin: var(--g2-space-2) 0 2px; font: var(--g2-font-size-label)/1.4 var(--g2-font-mono); color: var(--muted); align-items: center; }
  .legend .lg { display: inline-flex; gap: 6px; align-items: center; }
  .sw { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--line); flex: none; }
  .sw.q0 { background: var(--org-map-0); } .sw.q1 { background: var(--org-map-1); } .sw.q2 { background: var(--org-map-2); }
  .sw.q3 { background: var(--org-map-3); } .sw.q4 { background: var(--org-map-4); } .sw.q5 { background: var(--org-map-5); }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 var(--g2-space-3); margin: 0; padding: 0; list-style: none; font-size: var(--g2-font-size-meta); }
  .cgrid li { display: flex; gap: var(--g2-space-2); align-items: center; min-width: 0; }
  .cgrid .link { min-width: 0; overflow-wrap: anywhere; padding: 4px 0; }
  .cprof { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 420px); grid-template-rows: auto 1fr;
           grid-template-areas: "head map" "tree map"; gap: 0 var(--g2-space-6); align-items: start; }
  .cprof > .prof { grid-area: head; }
  .cprof-tree { grid-area: tree; min-width: 0; }
  .cprof-map { grid-area: map; position: sticky; top: calc(var(--top-h, 0px) + 12px); min-width: 0; }
  .cprof-map svg.map { max-height: calc(100vh - var(--top-h, 0px) - 140px); }
  .cprof-map .sub { font-size: var(--g2-font-size-label); }
  svg.map .labels text { font-family: var(--g2-font-sans); fill: var(--text); stroke: var(--page); stroke-width: 2.5px; stroke-linejoin: round; paint-order: stroke;
                         text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  svg.map .labels .k-seat { font-weight: 700; } svg.map .labels .k-m, svg.map .labels .k-s, svg.map .labels .k-o { font-weight: 600; }
  svg.map .labels .k-c { fill: var(--muted); }
  .prof { display: flex; flex-wrap: wrap; gap: var(--g2-space-2) var(--g2-space-4); align-items: center; margin: 0 0 var(--g2-space-4); }
  .prof img { width: 64px; height: 64px; object-fit: contain; flex: none; }
  .prof h2 { margin: 0; font-size: var(--g2-font-size-heading-section); }
  .prof .sub { margin: 2px 0 var(--g2-space-2); }
  .prof-head { min-width: 0; }
  .maperr { color: var(--muted); font-size: var(--g2-font-size-meta); }

  /* tables: the DS .g2-table. Local variations: a whole row opens the record, and long values wrap. */
  .g2-table td { overflow-wrap: anywhere; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgb(var(--g2-color-selected-bg)); }
  tbody tr:hover .nm { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
  .nm { font-weight: 700; line-height: 1.3; }
  .sub { color: var(--muted); font-size: var(--g2-font-size-meta); }
  td > .sub { margin-top: 2px; }
  .contact { font-size: var(--g2-font-size-meta); line-height: 1.4; }
  .contact .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.main th.c, table.main td.c { width: 34%; }
  table.main td.c { max-width: 0; }
  .dc { font: var(--g2-font-size-label)/1.4 var(--g2-font-mono); white-space: nowrap; }
  .more { display: flex; margin: var(--g2-space-4) auto; }

  /* source badges: one ink per source, outlined, for the record dialog and the source filter */
  .src { display: inline-block; padding: 0 5px; margin-right: 4px; border: 1px solid currentColor;
         font: var(--g2-font-size-label)/1.5 var(--g2-font-mono); }
  .src.a { color: rgb(var(--g2-color-info-ink)); } .src.r { color: rgb(var(--g2-color-success-ink)); }
  .src.g { color: rgb(var(--g2-color-warning-ink)); } .src.d { color: rgb(var(--g2-color-progress-ink)); }
  td > .g2-tag { margin-left: 6px; vertical-align: 2px; }
  /* a warning paragraph: the DS inset with the warning tone */
  .flag { display: block; margin: var(--g2-space-2) 0; padding: var(--g2-space-2) var(--g2-space-3); border-left: 5px solid rgb(var(--g2-color-warning-line));
          background: rgb(var(--g2-color-warning-bg)); color: rgb(var(--g2-color-warning-ink)); font-size: var(--g2-font-size-meta); }

  /* trees */
  .tree details { margin-left: 18px; }
  .tree > details { margin-left: 0; }
  .tree summary { cursor: pointer; min-height: 36px; padding: 6px 6px; list-style: none;
                  display: flex; gap: 2px var(--g2-space-2); align-items: baseline; flex-wrap: wrap; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "▸"; color: var(--muted); width: 12px; flex: none; transition: transform .1s; }
  .tree details[open] > summary::before { transform: rotate(90deg); }
  .tree summary:hover { background: var(--sunken); }
  .tree .grp > summary { font-weight: 700; }
  .tree summary .label { min-width: 0; overflow-wrap: anywhere; }
  .count { font: var(--g2-font-size-label)/1.4 var(--g2-font-mono); color: var(--muted); flex: none; }
  .count.note { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; font-family: var(--g2-font-sans); }
  button.link.count { font-family: var(--g2-font-sans); font-weight: 400; color: var(--link); }
  .ctx > summary .label { color: var(--muted); }
  .reveal { display: block; margin: 4px 0 6px 24px; padding: 4px 0; font-size: var(--g2-font-size-meta); }
  /* a button that looks like a link: the DS in-text link */
  .link { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit;
          text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
  .link:hover { text-decoration-thickness: 3px; }
  .link.acc { color: var(--link); }
  .kids { padding-bottom: 2px; }
  /* breadcrumbs: the DS .g2-breadcrumbs */
  .g2-breadcrumbs { margin: 0 0 var(--g2-space-3); }
  .more.small { margin: var(--g2-space-1) 0 var(--g2-space-1) 36px; }
  /* institutions inside a tree node: compact table */
  .lt-wrap { margin: 2px 0 var(--g2-space-3) 18px; overflow-x: auto; }
  table.lt { font-size: var(--g2-font-size-meta); }
  table.lt th { padding: 4px 8px; }
  table.lt td { padding: 6px 8px; line-height: 1.35; }
  table.lt td.c-cat { color: var(--muted); min-width: 110px; }
  table.lt .nm { font-weight: 600; }
  table.lt tr.ctx td { color: var(--muted); }
  table.lt td.c-site { max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* dialogs */
  dialog { width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 40px); padding: 0;
           border: var(--g2-border-width-control) solid var(--text); background: var(--page); color: var(--text); }
  dialog::backdrop { background: rgb(11 12 12 / .6); }
  .dh { display: flex; gap: var(--g2-space-3); align-items: flex-start; padding: var(--g2-space-4) var(--g2-space-4) var(--g2-space-1); }
  .dh > div { min-width: 0; }
  .dh h2 { font-size: var(--g2-font-size-heading-section); margin: 0 0 var(--g2-space-2); overflow-wrap: anywhere; }
  .dh h2:focus { outline: none; }
  .dh .x { margin-left: auto; width: 44px; height: 44px; flex: none; border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; }
  .db { padding: 0 var(--g2-space-4) var(--g2-space-4); }
  .dtools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--g2-space-2) var(--g2-space-3); margin: var(--g2-space-1) 0; font-size: var(--g2-font-size-meta); }
  .dtools input { width: min(100%, 360px); }
  /* record details: the DS .g2-summary-list */
  .sec { margin: var(--g2-space-5) 0 2px; padding-top: var(--g2-space-3); border-top: 1px solid var(--line); font-size: var(--g2-font-size-label);
         font-weight: 700; color: var(--muted); }
  ul.plain { margin: 4px 0 0; padding-left: 20px; }
  ul.plain li { overflow-wrap: anywhere; }

  .g2-footer { margin-top: var(--g2-space-6); font-size: var(--g2-font-size-meta); }

  /* Focus. Local controls above set colour and background, and the app layer wins over gov2.states.
     These rules write the DS focus treatment again (COMPONENTS.md, "Layers and project CSS"). */
  :is(a, button, summary):not(.g2-btn):focus-visible { outline: 3px solid transparent; background: rgb(var(--g2-color-focus)); color: rgb(var(--g2-color-on-focus));
    box-shadow: 0 -2px rgb(var(--g2-color-focus)), 0 4px rgb(var(--g2-color-on-focus)); text-decoration: none; }
  :is(a, button, summary):not(.g2-btn):focus-visible :is(.count, .label, .sub, .arrow, .menu-status, #stats) { color: inherit; }
  .multi > summary:focus-visible { outline: 3px solid rgb(var(--g2-color-focus)); outline-offset: 0; box-shadow: inset 0 0 0 2px rgb(var(--g2-color-text)); }
  tbody tr:focus-visible { outline: 3px solid rgb(var(--g2-color-focus)); outline-offset: -3px; }

  @media (max-width: 760px) {
    .cprof { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "head" "map" "tree"; }
    .cprof-map { position: static; margin-bottom: var(--g2-space-3); }
    #q { flex: 1 1 140px; }
    #ftoggle { display: inline-flex; order: 1; }
    /* phones: one row (search, Filtre); Resetează shows with the open disclosure */
    #reset { order: 2; display: none; }
    .filters:has(.fmore.open) #reset { display: inline-flex; }
    .fmore { display: none; order: 3; flex: 0 0 100%; grid-template-columns: 1fr 1fr; gap: var(--g2-space-2); max-height: 55vh; overflow-y: auto; }
    .fmore.open { display: grid; }
    .fmore > * { order: 0; }
    .fmore > .multi { grid-column: 1 / -1; }
    .multi .panel { position: static; width: auto; max-width: none; margin-top: 4px; }
    .navmore .panel { position: absolute; right: 0; width: 290px; max-width: calc(100vw - 24px); }
    th.c, td.c, table.lt .c-cat, table.lt .c-where { display: none; }
    .csv-hint { display: none; }
  }
}
</style>
</head>
<body>
<a class="g2-skip-link" href="#main">Sari la conținut</a>
<header class="g2-header">

    <a class="g2-wordmark" id="home-link" href="#" aria-label="Instituții publice — Acasă"><img class="g2-logo" src="assets/img/gx00.png" width="28" height="28" alt=""><h1><span class="g2-ro-sweep">Instituții publice</span></h1></a>
